<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Sens Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #1F2022;
      --bg-card: #2C2C31;
      --bg-input: #37373D;
      --accent: #638CDE;
      --text-main: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --radius-card: 25px;
      --radius-input: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 24px 70px;
    }

    /* Top Bar */
    .topbar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pill-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 6px 16px 6px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pill-badge:hover {
      background: var(--bg-input);
    }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #18191b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
    }

    .avatar-circle svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .lang-pill {
      padding: 6px 14px 6px 10px;
      gap: 8px;
    }

    .flag-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Header & Mode Switch */
    h1 {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 24px;
    }

    .mode-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 26px;
    }

    .mode-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-tab.active {
      background: var(--bg-card);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }

    /* Layout Container */
    .main-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Main Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 28px 32px 32px;
    }

    .converter-grid {
      display: grid;
      grid-template-columns: 1fr 44px 1fr;
      column-gap: 14px;
      row-gap: 22px;
      align-items: end;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .select-wrap {
      position: relative;
      width: 100%;
    }

    .input-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-input);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      height: 50px;
      padding: 0 18px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-control:focus {
      border-color: var(--accent);
    }

    select.input-control {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 42px;
      cursor: pointer;
    }

    .select-chevron {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
    }

    /* Swap Button with Gradient Ring */
    .swap-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background:
        linear-gradient(var(--bg-input), var(--bg-input)) padding-box,
        linear-gradient(135deg, var(--accent) 0%, rgba(99, 140, 222, 0.1) 100%) border-box;
      border: 1.5px solid transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 4px;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .swap-btn:hover {
      transform: rotate(180deg);
      filter: brightness(1.12);
    }

    /* Big Sensitivity Boxes */
    .big-box {
      height: 112px;
      border-radius: var(--radius-input);
      background: var(--bg-input);
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: relative;
    }

    .big-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 42px;
      font-weight: 600;
    }

    .big-input::-webkit-outer-spin-button,
    .big-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Result Box with Gradient Outline */
    .big-box.result-highlight {
      background:
        linear-gradient(var(--bg-input), var(--bg-input)) padding-box,
        linear-gradient(90deg, var(--accent) 0%, rgba(99, 140, 222, 0.08) 100%) border-box;
      border: 1.5px solid transparent;
      justify-content: space-between;
    }

    .result-number {
      font-size: 42px;
      font-weight: 600;
      color: var(--text-main);
      user-select: all;
    }

    .copy-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .copy-circle-btn:hover {
      filter: brightness(1.1);
    }

    .copy-circle-btn:active {
      transform: scale(0.92);
    }

    /* Stats Cards Row */
    .stats-row {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      height: 162px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stat-dual {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      width: 100%;
      height: 100%;
      align-items: center;
    }

    .stat-divider {
      width: 1px;
      height: 92px;
      background: rgba(255, 255, 255, 0.07);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .stat-item .sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .stat-item .val {
      font-size: 42px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Slider Area */
    .slider-wrapper {
      width: 100%;
      max-width: 580px;
      margin: 34px auto 0;
      display: flex;
      flex-direction: column;
    }

    .scale-labels {
      position: relative;
      height: 22px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .scale-mark {
      position: absolute;
      transform: translateX(-50%);
      color: var(--text-muted);
      white-space: nowrap;
      transition: opacity 0.18s ease;
    }

    .scale-mark.dynamic {
      color: var(--text-main);
      font-weight: 600;
      z-index: 3;
      will-change: left;
    }

    /* Track Pill */
    .track-outer {
      position: relative;
      width: 100%;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(90deg, #638CDE 0%, rgba(99, 140, 222, 0.35) 55%, rgba(44, 44, 49, 0.95) 100%);
      display: flex;
      align-items: center;
    }

    .ticks-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tick {
      position: absolute;
      top: 0;
      width: 1.5px;
      background: rgba(255, 255, 255, 0.65);
      transform: translateX(-50%);
    }

    .tick.major {
      height: 11px;
    }

    .tick.minor {
      height: 6px;
      background: rgba(255, 255, 255, 0.45);
    }

    .range-input {
      position: relative;
      width: 100%;
      height: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      z-index: 4;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: grab;
      transition: transform 0.12s ease;
    }

    .range-input::-webkit-slider-thumb:active {
      cursor: grabbing;
      transform: scale(1.12);
    }

    /* Reference Range Bars */
    .pro-ranges {
      position: relative;
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .range-group {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .range-bar {
      height: 12px;
      border-radius: 999px;
      transition: margin-left 0.3s ease, width 0.3s ease;
    }

    .range-bar.from-bar {
      background: #2C2C31;
    }

    .range-bar.to-bar {
      background: #FFFFFF;
    }

    .range-caption {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      transition: margin-left 0.3s ease;
    }

    @media (max-width: 760px) {
      .converter-grid {
        grid-template-columns: 1fr;
      }
      .swap-btn {
        margin: 0 auto;
      }
      .stats-row {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- Title -->

  <!-- Mode Switch -->

  <div class="main-container">
    <!-- Main Converter Card -->
    <div class="card">

        </div>

        <div></div>

        </div>
      </div>
    </div>

  </div>

  <script>
    const GAMES = {
      cs: { name: 'Counter-Strike', yaw: 0.022, proRange: [33, 65] },
      valorant: { name: 'Valorant', yaw: 0.07, proRange: [36, 71] },
      apex: { name: 'Apex Legends', yaw: 0.022, proRange: [25, 48] },
      overwatch: { name: 'Overwatch 2', yaw: 0.0066, proRange: [22, 45] },
      r6: { name: 'Rainbow Six Siege', yaw: 0.00572958, proRange: [30, 62] }
    };

    let currentMode = 'game';
    let currentLang = 'en';

    const gameFromEl = document.getElementById('gameFrom');
    const gameToEl = document.getElementById('gameTo');
    const sensInputEl = document.getElementById('sensInput');
    const sensOutputEl = document.getElementById('sensOutput');
    const dpiFromEl = document.getElementById('dpiFrom');
    const dpiToEl = document.getElementById('dpiTo');
    const statCmEl = document.getElementById('statCm');
    const statInEl = document.getElementById('statIn');
    const statEdpiEl = document.getElementById('statEdpi');
    const cmRangeEl = document.getElementById('cmRange');
    const dynCmLabelEl = document.getElementById('dynCmLabel');
    const lblSensFromEl = document.getElementById('lblSensFrom');
    const lblSensToEl = document.getElementById('lblSensTo');
    const staticMarks = document.querySelectorAll('.scale-mark[data-cm]');

    // Переменные для эффекта плавной инерции ("отставания") текста за бегунком
    let targetPercent = 35.2;
    let currentPercent = 35.2;
    let targetCmValue = 34.64;

    function animateLabelFollow() {
      // Коэффициент 0.14 создает мягкое, заметное глазу запаздывание за бегунком
      currentPercent += (targetPercent - currentPercent) * 0.14;
      dynCmLabelEl.style.left = `${currentPercent.toFixed(3)}%`;

      // Скрываем статические отметки (10, 20, 35, 50, 65, 80), когда плавающий текст приближается к ним
      const currentAnimatedCm = 10 + (currentPercent / 100) * 70;
      staticMarks.forEach(mark => {
        const markCm = parseFloat(mark.getAttribute('data-cm'));
        mark.style.opacity = Math.abs(currentAnimatedCm - markCm) < 5.5 ? '0' : '1';
      });

      requestAnimationFrame(animateLabelFollow);
    }
    requestAnimationFrame(animateLabelFollow);

    function formatSens(num) {
      if (!isFinite(num) || num <= 0) return '0';
      return parseFloat(num.toFixed(3)).toString();
    }

    function updateLabels() {
      const fromName = GAMES[gameFromEl.value].name;
      const toName = GAMES[gameToEl.value].name;

      if (currentLang === 'en') {
        lblSensFromEl.textContent = currentMode === 'game' ? `Sensitivity in ${fromName}` : 'Target cm/360';
        lblSensToEl.textContent = `Sensitivity in ${toName}`;
      } else {
        lblSensFromEl.textContent = currentMode === 'game' ? `Сенса в ${fromName}` : 'Дистанция cm/360';
        lblSensToEl.textContent = `Сенса в ${toName}`;
      }
    }

    function updateProBars() {
      const fromGame = GAMES[gameFromEl.value];
      const toGame = GAMES[gameToEl.value];

      const setBar = (barEl, textEl, range, prefix, gameName) => {
        const minPct = ((range[0] - 10) / 70) * 100;
        const widthPct = ((range[1] - range[0]) / 70) * 100;
        barEl.style.marginLeft = `${minPct}%`;
        barEl.style.width = `${widthPct}%`;
        textEl.style.marginLeft = `${minPct}%`;
        textEl.textContent = `${prefix} ${gameName}  ${range[0]}-${range[1]} cm`;
      };

      const fromPrefix = currentLang === 'en' ? 'From' : 'Из';
      const toPrefix = currentLang === 'en' ? 'To' : 'В';

      setBar(
        document.getElementById('fromRangeBar'),
        document.getElementById('fromRangeText'),
        fromGame.proRange,
        fromPrefix,
        fromGame.name
      );

      setBar(
        document.getElementById('toRangeBar'),
        document.getElementById('toRangeText'),
        toGame.proRange,
        toPrefix,
        toGame.name.toLowerCase() === 'valorant' ? 'valorant' : toGame.name
      );
    }

    function syncSliderVisuals(cm360) {
      const clamped = Math.min(Math.max(cm360, 10), 80);
      cmRangeEl.value = clamped;
      targetCmValue = cm360;
      targetPercent = ((clamped - 10) / 70) * 100;
      dynCmLabelEl.textContent = `${cm360.toFixed(2)} cm`;
    }

    function calculate(fromSlider = false) {
      updateLabels();
      updateProBars();

      const fromKey = gameFromEl.value;
      const toKey = gameToEl.value;
      const yawFrom = GAMES[fromKey].yaw;
      const yawTo = GAMES[toKey].yaw;

      const dpiFrom = parseFloat(dpiFromEl.value) || 800;
      const dpiTo = parseFloat(dpiToEl.value) || 800;

      let cm360 = 34.64;

      if (fromSlider) {
        cm360 = parseFloat(cmRangeEl.value) || 34.64;
        if (currentMode === 'game') {
          const calcSourceSens = (360 * 2.54) / (cm360 * dpiFrom * yawFrom);
          sensInputEl.value = parseFloat(calcSourceSens.toFixed(3));
        } else {
          sensInputEl.value = cm360.toFixed(2);
        }
      } else {
        const inputVal = parseFloat(sensInputEl.value) || 0;
        if (currentMode === 'game') {
          if (inputVal > 0 && dpiFrom > 0) {
            cm360 = (360 * 2.54) / (dpiFrom * inputVal * yawFrom);
          } else {
            cm360 = 0;
          }
        } else {
          cm360 = inputVal;
        }
      }

      if (cm360 > 0 && dpiTo > 0) {
        const targetSens = (360 * 2.54) / (cm360 * dpiTo * yawTo);
        const in360 = cm360 / 2.54;
        const edpi = Math.round(targetSens * dpiTo);

        sensOutputEl.textContent = formatSens(targetSens);
        statCmEl.textContent = cm360.toFixed(2);
        statInEl.textContent = in360.toFixed(2);
        statEdpiEl.textContent = edpi.toString();

        syncSliderVisuals(cm360);
      } else {
        sensOutputEl.textContent = '0';
        statCmEl.textContent = '0.00';
        statInEl.textContent = '0.00';
        statEdpiEl.textContent = '0';
      }
    }

    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      document.getElementById('tabGame').classList.toggle('active', mode === 'game');
      document.getElementById('tabCm').classList.toggle('active', mode === 'cm');

      if (mode === 'cm') {
        gameFromEl.disabled = true;
        dpiFromEl.disabled = true;
        dpiFromEl.style.opacity = '0.45';
        sensInputEl.value = parseFloat(statCmEl.textContent) || 34.64;
      } else {
        gameFromEl.disabled = false;
        dpiFromEl.disabled = false;
        dpiFromEl.style.opacity = '1';
        const curCm = parseFloat(statCmEl.textContent) || 34.64;
        const dpiFrom = parseFloat(dpiFromEl.value) || 2400;
        const yawFrom = GAMES[gameFromEl.value].yaw;
        const restoredSens = (360 * 2.54) / (curCm * dpiFrom * yawFrom);
        sensInputEl.value = parseFloat(restoredSens.toFixed(3));
      }
      calculate();
    }

    function swapGames() {
      if (currentMode === 'cm') return;
      const tmpGame = gameFromEl.value;
      gameFromEl.value = gameToEl.value;
      gameToEl.value = tmpGame;

      const tmpDpi = dpiFromEl.value;
      dpiFromEl.value = dpiToEl.value;
      dpiToEl.value = tmpDpi;

      sensInputEl.value = sensOutputEl.textContent;
      calculate();
    }

    function copySensitivity() {
      const val = sensOutputEl.textContent;
      navigator.clipboard.writeText(val).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.style.transform = 'scale(0.88)';
        btn.style.background = '#4caf50';
        setTimeout(() => {
          btn.style.transform = '';
          btn.style.background = '';
        }, 700);
      });
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'ru' : 'en';
      document.getElementById('langText').textContent = currentLang.toUpperCase();
      document.getElementById('mainTitle').textContent =
        currentLang === 'en' ? 'Mouse Sens Converter' : 'Конвертер чувствительности';
      document.getElementById('lblConvertFrom').textContent =
        currentLang === 'en' ? 'Convert from' : 'Конвертировать из';
      document.getElementById('lblConvertTo').textContent =
        currentLang === 'en' ? 'Convert to' : 'Конвертировать в';
      calculate();
    }

    // Event Listeners
    [gameFromEl, gameToEl, sensInputEl, dpiFromEl, dpiToEl].forEach(el => {
      el.addEventListener('input', () => calculate(false));
      el.addEventListener('change', () => calculate(false));
    });

    cmRangeEl.addEventListener('input', () => calculate(true));

    // Initial render
    calculate(false);
  </script>
</body>
</html>
